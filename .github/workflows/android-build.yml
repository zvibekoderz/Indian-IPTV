name: Android build

# Builds the debug APK and runs the unit tests on every push to main and to
# feature branches, on pull requests targeting main, and on demand.
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APKs (TV + mobile modules)
        run: ./gradlew :app:assembleDebug :mobileapp:assembleDebug --stacktrace

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indian-iptv-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mobileapp/build/outputs/apk/debug/mobileapp-debug.apk
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :mobileapp:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest
            mobileapp/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
